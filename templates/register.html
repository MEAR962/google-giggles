<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>google giggles - Join</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 320px; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #1a73e8; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .switch-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .switch-link a { color: #1a73e8; text-decoration: none; }
        .alert { color: #ff6b6b; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="auth-card">
    <h2>Create Account</h2>
    {% with messages = get_flashed_messages() %}
    {% if messages %}{% for msg in messages %}<div class="alert">{{ msg }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <h4 style="margin: 15px 0 5px 0; color: #888;">Custom 2FA Rule (Optional)</h4>
        <input type="text" name="custom_question" placeholder="e.g., What is your fav Minecraft block?">
        <input type="text" name="custom_answer" placeholder="e.g., Diamond Ore">

        <button type="submit">Sign Up</button>
    </form>
    <div class="switch-link">Already a gigglr? <a href="/login">Log In</a></div>
</div>
</body>
</html>
