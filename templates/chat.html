<script>
    const logStream = document.getElementById('log-stream');
    const msgForm = document.getElementById('msg-form');
    const msgText = document.getElementById('msg-text');
    
    let lastMessageCount = 0;

    // 🚀 ULTRA-LIGHT POLLING DISPATCHER: Pulls messages from the server ledger cleanly without freezing threads
    async function fetchChatMessages() {
        try {
            const response = await fetch("/chat_messages/{{ room_id }}");
            const data = await response.json();
            
            // Only re-render elements if a brand new message payload actually hits the ledger file
            if (data.messages.length !== lastMessageCount) {
                logStream.innerHTML = ''; // Clean out chat view frame
                
                data.messages.forEach(msg => {
                    const bubble = document.createElement('div');
                    bubble.className = 'message-bubble';
                    
                    // Highlight your own messages with a clean green left-border tag natively
                    if (msg.user.toLowerCase() === "{{ current_user.lower() }}") {
                        bubble.style.borderLeftColor = '#34a853';
                    }
                    
                    bubble.innerHTML = `<strong>@${msg.user}:</strong> ${msg.msg}`;
                    logStream.appendChild(bubble);
                });
                
                logStream.scrollTop = logStream.scrollHeight; // Auto-scroll to freshest content
                lastMessageCount = data.messages.length;
            }
        } catch (err) {
            console.log("Terminal sync issue:", err);
        }
    }

    // AJAX Form submitter: appends inputs to server filesystem seamlessly
    msgForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const text = msgText.value.trim();
        if (!text) return;

        const formData = new FormData();
        formData.append('message', text);
        msgText.value = ''; // Instantly clear input field for crisp, immediate user feedback

        await fetch("/chat_send/{{ room_id }}", {
            method: "POST",
            body: formData
        });

        fetchChatMessages(); // Instantly update view frame on local statement transmission
    });

    // Run initial sync on load, then loop back safely every 1.5 seconds 
    fetchChatMessages();
    setInterval(fetchChatMessages, 1500);
</script>
