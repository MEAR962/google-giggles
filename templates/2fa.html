<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>google giggles - Verification Check</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 340px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 15px 0; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #1a73e8; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .alert { color: #ff6b6b; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="auth-card">
    <h2>🔒 2FA Verification</h2>
    <p style="color: #aaa; font-size: 14px;">Answer your custom security question to complete authorization:</p>

    <h3 style="color: #1a73e8; margin: 20px 0; background: #111; padding: 15px; border-radius: 6px;">
        {{ question }}
    </h3>

    {% with messages = get_flashed_messages() %}
    {% if messages %}{% for msg in messages %}<div class="alert">{{ msg }}</div>{% endfor %}{% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="2fa_answer" placeholder="Your Answer" required autofocus autocomplete="off">
        <button type="submit">Verify & Enter</button>
    </form>
</div>
</body>
</html>
